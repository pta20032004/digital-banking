server:
  port: 8080
  servlet:
    session:
      timeout: 30m

system:
    user: 
        name: ${SYSTEM_USER_1}
        password: "${SYSTEM_USER_1_PASSWORD}"
spring:
    application:
        name: demo
    profiles:
        active: dev
    datasource:
        url: jdbc:postgresql://localhost:5434/${DB_NAME}?currentSchema=${SCHEMA_NAME}
        username: ${DB_USER:postgres}
        password: ${DB_PASSWORD:123456}
        driver-class-name: org.postgresql.Driver
        hikari:
            # Thời gian chờ tối đa để lấy một kết nối từ pool (ms)
            connection-timeout: 30000
            # Số lượng kết nối tối thiểu được duy trì trong pool
            minimum-idle: 10
            # Số lượng kết nối tối đa trong pool
            maximum-pool-size: 20
            # Thời gian tối đa một kết nối được phép rảnh rỗi (ms)
            idle-timeout: 600000
            # Thời gian sống tối đa của một kết nối (ms)
            max-lifetime: 1800000
            # Tên của pool (hữu ích khi giám sát/log)
            pool-name: MyHikariCP
    jpa:
        # Hibernate không tự động tạo/sửa bảng (vì đã có Flyway lo)
        hibernate:
            ddl-auto: none #validate
        
        # Hiển thị log SQL ra console để bạn dễ debug
        show-sql: true
        properties:
            hibernate:
                # Định dạng SQL cho dễ đọc trên console
                "[format_sql]": true
                "[default_schema]": ${SCHEMA_NAME}
                dialect: org.hibernate.dialect.PostgreSQLDialect
                jdbc:
                    "[batch_size]": 20 #Chỉ gom được các câu lệnh SQL giống hệt nhau về cấu trúc chữ, chỉ khác nhau giá trị truyền vào.
                    "[order_inserts]": true 
                    # Hiểu đơn giản: Nó tự động sắp xếp các lệnh INSERT theo cùng một bảng lại gần nhau trước khi chạy. 
                    # Mục đích là để không làm lãng phí tính năng batch_size vừa nói ở trên.
# Lý do:
# JDBC chỉ có thể gom nhóm (batch) các câu lệnh giống hệt nhau về cấu trúc SQL, chỉ khác dữ liệu truyền vào. Nếu đang gom lệnh cho Bảng A, tự nhiên xen ngang một lệnh của Bảng B, JDBC sẽ lập tức chốt chuyến của Bảng A đem đi chạy luôn, rồi mở một chuyến mới cho Bảng B.
                    "[order_updates]": true
    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true
        #base-line-version: 0

    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            password: ${REDIS_PASSWORD:}

    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        consumer:
            group-id: ${KAFKA_CONSUMER_GROUP:banking-group}
            auto-offset-reset: earliest
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    mail:
        host: smtp.gmail.com
        port: 587
        username: ${GMAIL_USERNAME}
        password: ${GMAIL_APP_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
                        required: true

logging:
  level:
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.type.descriptor.sql.BasicBinder]": TRACE
    "[org.apache.kafka.clients.consumer]": INFO
    "[org.springframework.kafka]": INFO

fake:
  customer:
    username: ${FAKE_CUSTOMER_USERNAME}
    fullName: ${FAKE_CUSTOMER_FULL_NAME}
    dob: ${FAKE_CUSTOMER_DOB}
    email: ${FAKE_CUSTOMER_EMAIL}
    password: ${FAKE_CUSTOMER_PASSWORD}
    phone: ${FAKE_CUSTOMER_PHONE}
    identity: ${FAKE_CUSTOMER_IDENTITY}
    kycStatus: ${FAKE_CUSTOMER_KYC_STATUS}

    manager:
        employeeCode: ${FAKE_MANAGER_CODE}
        fullName: ${FAKE_MANAGER_FULL_NAME}
        email: ${FAKE_MANAGER_EMAIL}
        password: ${FAKE_MANAGER_PASSWORD}
        roleId: 1051 # ROLE_MANAGER
        department: ${FAKE_MANAGER_DEPARTMENT}
        branchCode: ${FAKE_MANAGER_BRANCH}

    teller:
        employeeCode: ${FAKE_TELLER_CODE}
        fullName: ${FAKE_TELLER_FULL_NAME}
        email: ${FAKE_TELLER_EMAIL}
        password: ${FAKE_TELLER_PASSWORD}
        roleId: 1101 # ROLE_TELLER
        department: ${FAKE_TELLER_DEPARTMENT}
        branchCode: ${FAKE_TELLER_BRANCH}

aws:
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}
  region: ${region}
  s3:
    bucket:
      kyc: ${kyc}
      audit: ${audit}
      chat: ${chat}